name: backend CI

on:
  push:
    branches: [main]
    paths:
      - "app/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "app/backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: app/backend

jobs:
  lint-and-typecheck:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps (with dev)
        run: uv sync --group dev

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy app

  test:
    name: pytest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jazz
          POSTGRES_PASSWORD: jazz
          POSTGRES_DB: jazz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jazz -d jazz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://jazz:jazz@localhost:5432/jazz_test
      PGPASSWORD: jazz

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps (with dev)
        run: uv sync --group dev

      - name: Create jazz_test database
        run: psql -h localhost -U jazz -d jazz -c "CREATE DATABASE jazz_test;"

      - name: pytest ${{ matrix.suite }}
        run: uv run pytest tests/${{ matrix.suite }} -v

  openapi-spec-check:
    # Checks that the committed openapi.json was refreshed with `make spec` after backend
    # code changes. Imports the FastAPI app directly, dumps `app.openapi()`, pretty-prints
    # it with jq and requires a byte-for-byte match with the committed file. Lifespan never
    # starts, so it needs no DB or server and runs fast (matches what `make spec` produces).
    name: openapi.json freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps (with dev)
        run: uv sync --group dev

      - name: Verify openapi.json is up to date
        run: |
          set -euo pipefail
          uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" \
            | jq --indent 2 . > /tmp/openapi.json
          if ! diff -u openapi.json /tmp/openapi.json; then
            echo "::error::openapi.json is stale. Run 'cd app && make spec' and commit the result."
            exit 1
          fi
