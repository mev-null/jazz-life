name: backend CI

on:
  push:
    branches: [main]
    paths:
      - "app/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "app/backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: app/backend

jobs:
  lint-and-typecheck:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps (with dev)
        run: uv sync --group dev

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy app

  test:
    name: pytest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jazz
          POSTGRES_PASSWORD: jazz
          POSTGRES_DB: jazz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jazz -d jazz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://jazz:jazz@localhost:5432/jazz_test
      PGPASSWORD: jazz

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps (with dev)
        run: uv sync --group dev

      - name: Create jazz_test database
        run: psql -h localhost -U jazz -d jazz -c "CREATE DATABASE jazz_test;"

      - name: pytest ${{ matrix.suite }}
        run: uv run pytest tests/${{ matrix.suite }} -v

  openapi-spec-check:
    # backend のコード変更後に `make spec` でコミット済み openapi.json を更新し忘れていないか
    # 検証する。FastAPI app を直接 import して `app.openapi()` をダンプし、jq で整形した
    # 結果がコミット済みファイルと byte 一致するかを確認する。lifespan を起動しないので
    # DB 不要・サーバ不要で軽量に走る（make spec の jq 出力と一致する）。
    name: openapi.json freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps (with dev)
        run: uv sync --group dev

      - name: Verify openapi.json is up to date
        run: |
          set -euo pipefail
          uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" \
            | jq --indent 2 . > /tmp/openapi.json
          if ! diff -u openapi.json /tmp/openapi.json; then
            echo "::error::openapi.json is stale. Run 'cd app && make spec' and commit the result."
            exit 1
          fi
