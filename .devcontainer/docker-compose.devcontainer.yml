# Devcontainer-only compose stack.
# VS Code / Codespaces attach to the `workspace` service defined here.
# The app itself (db / backend / frontend) is started as a separate compose project from
# ../app/docker-compose.yml, using the docker daemon inside the workspace container
# (provided by the docker-in-docker feature). Bind-mount paths are resolved on the
# workspace container's own filesystem, so relative paths such as ../app/backend/app
# work unchanged in Codespaces.
services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    volumes:
      - ..:/workspaces/jazz-life:cached
    command: sleep infinity
