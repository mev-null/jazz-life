# Devcontainer-only compose stack.
# VS Code / Codespaces はここで定義する `workspace` サービスにアタッチする。
# アプリ本体 (db / backend / frontend) は ../app/docker-compose.yml で
# workspace コンテナ内の docker daemon (docker-in-docker feature が提供) を
# 使って別プロジェクトとして起動する。bind mount の path 解決は workspace
# コンテナのファイルシステム上で完結するため、Codespaces 環境でも
# ../app/backend/app のような相対パスがそのまま効く。
services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    volumes:
      - ..:/workspaces/jazz-life:cached
    command: sleep infinity
