# SPA + API reverse proxy を想定した nginx 設定。
# - 静的アセットはそのまま配信
# - `/api/` は同 origin で受けて backend service へ proxy
# - React Router の deep link を維持するため、ファイルが無ければ index.html にフォールバック
# - listen は ${PORT} (envsubst で展開される、ローカル既定 80 / Railway は注入された値)
#
# なぜ proxy_pass を挟むか:
#   frontend と backend を別 origin (*.up.railway.app の別 subdomain) で公開すると
#   `up.railway.app` が Public Suffix List 登録なため別 site 扱いになり、
#   iOS Safari の ITP が SameSite=None; Secure cookie もブロックする。
#   nginx で同一 origin に揃えることで cookie を確実に往復させる。
#
# なぜ resolver + 変数 proxy_pass か:
#   nginx は `proxy_pass http://hostname` の hostname を **プロセス起動時に 1 度だけ
#   解決し以降はワーカ寿命の間ずっと固定** する。backend を redeploy すると IP が
#   変わるため、frontend nginx は古い IP に向け続けてタイムアウトし続ける事故が
#   起きる。`resolver` directive + `proxy_pass http://$var` で **リクエストごとに
#   解決** し、`valid=10s` で短時間キャッシュにすることで、backend redeploy 後
#   最大 10 秒で新 IP に追従する。
#
# このファイルは envsubst テンプレート化されており、Dockerfile prod stage で
# /etc/nginx/templates/default.conf.template に COPY される。
# NGINX_ENVSUBST_FILTER='^(PORT|BACKEND_INTERNAL_HOST|BACKEND_INTERNAL_PORT|NAMESERVER)$'
# で限定的に展開し、nginx 変数 ($uri 等) は保護する。

server {
    listen ${PORT};
    server_name _;

    # resolver で動的 DNS 解決を許可。${NAMESERVER} は entrypoint script で
    # /etc/resolv.conf から動的抽出される (Railway 内部 DNS or fallback 1.1.1.1)。
    # ipv6=on で AAAA レコード (Railway private networking) を引けるようにする。
    resolver ${NAMESERVER} valid=10s ipv6=on;

    root /usr/share/nginx/html;
    index index.html;

    # API リクエストは Railway 内部ネットの backend へ proxy。
    # `backend.railway.internal` は AAAA only (IPv6) で解決される。
    # backend 側は dual-stack (app/server.py 経由) で IPv4 / IPv6 両方を受ける。
    location /api/ {
        # proxy_pass を変数化することで起動時 DNS 固定キャッシュを回避し、
        # resolver の valid=10s に従って per-request に解決させる。
        # 変数 proxy_pass では URI が自動転送されないので、$request_uri で
        # 明示的にクエリ含む URI を渡す。
        set $backend_upstream ${BACKEND_INTERNAL_HOST}:${BACKEND_INTERNAL_PORT};
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ハッシュ付きファイル名 (Vite の default) は immutable cache
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA フォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }
}
