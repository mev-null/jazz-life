# nginx config for an SPA + API reverse proxy.
# - Static assets are served as-is
# - `/api/` is accepted on the same origin and proxied to the backend service
# - Falls back to index.html when no file matches, so React Router deep links keep working
# - Listens on ${PORT} (expanded by envsubst; local default 80, Railway injects its value)
#
# Why proxy_pass at all:
#   If frontend and backend are exposed on different origins (separate *.up.railway.app
#   subdomains), `up.railway.app` is on the Public Suffix List, so they count as different
#   sites and iOS Safari's ITP blocks even SameSite=None; Secure cookies. Putting both on
#   one origin behind nginx makes the cookie round-trip reliable.
#
# Why resolver + variable proxy_pass:
#   nginx resolves the hostname in `proxy_pass http://hostname` **once at startup and
#   keeps it fixed for the worker's lifetime**. Redeploying the backend changes its IP,
#   so the frontend nginx keeps pointing at the stale IP and times out forever. The
#   `resolver` directive + `proxy_pass http://$var` **resolves per request**, and
#   `valid=10s` keeps the cache short, so nginx follows a new backend IP within 10
#   seconds of a redeploy.
#
# This file is an envsubst template; the Dockerfile prod stage COPYs it to
# /etc/nginx/templates/default.conf.template.
# NGINX_ENVSUBST_FILTER='^(PORT|BACKEND_INTERNAL_HOST|BACKEND_INTERNAL_PORT)\$'
# restricts expansion so nginx variables ($uri etc.) are left intact.
# Only the resolver value bypasses envsubst: 25-patch-resolver.sh sed-replaces the
# __RESOLVER__ placeholder with the real IPs from /etc/resolv.conf
# (envsubst + NGINX_LOCAL_RESOLVERS failed twice, hence the runtime patch).

server {
    listen ${PORT};
    server_name _;

    # 25-patch-resolver.sh in the entrypoint replaces the __RESOLVER__ placeholder with
    # IPs built from /etc/resolv.conf. It bypasses envsubst, so it is unaffected by the
    # NGINX_ENVSUBST_FILTER regex or BuildKit's $ expansion.
    # valid=10s re-resolves every 10 seconds; ipv6=on also queries AAAA (Railway private networking).
    resolver __RESOLVER__ valid=10s ipv6=on;

    root /usr/share/nginx/html;
    index index.html;

    # API requests are proxied to the backend over Railway's private network.
    # `backend.railway.internal` resolves to AAAA only (IPv6).
    # The backend listens dual-stack (via app/server.py) and accepts both IPv4 and IPv6.
    location /api/ {
        # A variable in proxy_pass avoids the startup-time DNS cache and resolves
        # per request according to the resolver's valid=10s.
        # A variable proxy_pass does not forward the URI automatically, so
        # $request_uri passes the full URI, query string included, explicitly.
        set $backend_upstream ${BACKEND_INTERNAL_HOST}:${BACKEND_INTERNAL_PORT};
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Hashed filenames (Vite default) get an immutable cache
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
