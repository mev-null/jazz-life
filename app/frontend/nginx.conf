# SPA を想定した nginx 設定。
# - 静的アセットはそのまま配信
# - React Router の deep link を維持するため、ファイルが無ければ index.html にフォールバック
# - listen は ${PORT} (envsubst で展開される、ローカル既定 80 / Railway は注入された値)
#
# 注意: ここでは API への proxy_pass は設定しない。frontend は別 service として
# 配信され、API は VITE_API_BASE で埋め込まれた backend URL を直接叩く。
#
# 注意: このファイルは envsubst テンプレート化されており、Dockerfile prod stage で
# /etc/nginx/templates/default.conf.template に COPY される。
# NGINX_ENVSUBST_FILTER='^PORT$' で ${PORT} だけ展開し、nginx 変数 ($uri 等)
# は保護される。

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ハッシュ付きファイル名 (Vite の default) は immutable cache
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA フォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }
}
