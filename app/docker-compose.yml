services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jazz
      POSTGRES_PASSWORD: jazz
      POSTGRES_DB: jazz
    volumes:
      - jazz-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jazz -d jazz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: jazz-life-backend:dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://jazz:jazz@db:5432/jazz
      TEST_DATABASE_URL: postgresql+psycopg://jazz:jazz@db:5432/jazz_test
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: jazz-life-frontend:dev
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  jazz-pgdata:
