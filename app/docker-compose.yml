services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jazz
      POSTGRES_PASSWORD: jazz
      POSTGRES_DB: jazz
    volumes:
      - jazz-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jazz -d jazz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: jazz-life-backend:dev
    # `.env` は廃止。値は host shell から forward する。
    # - Codespaces: .devcontainer/devcontainer.json の containerEnv (公開デフォルト) と
    #   secrets (Codespaces user secrets から注入) が shell に揃う
    # - 非 Codespaces: 各自 host shell に export する (例: direnv で .envrc) か、
    #   app/.env を作っておけば docker-compose が自動で interpolation 用に拾う
    # - Railway などの本番デプロイは Railway UI 側で同名 env を設定する (ADR-005)
    environment:
      DATABASE_URL: postgresql+psycopg://jazz:jazz@db:5432/jazz
      TEST_DATABASE_URL: postgresql+psycopg://jazz:jazz@db:5432/jazz_test
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://127.0.0.1:8000/api/auth/callback}
      JWT_SECRET: ${JWT_SECRET:-}
      REFRESH_TOKEN_KEY: ${REFRESH_TOKEN_KEY:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://127.0.0.1:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # ローカル / CI は /docs を見られたいので default true、本番では false にする
      EXPOSE_OPENAPI_DOCS: ${EXPOSE_OPENAPI_DOCS:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # ローカルは Vite dev server (HMR) で動かす。本番 build は Railway 側で
      # `target: prod` を指定する。
      target: dev
    image: jazz-life-frontend:dev
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://127.0.0.1:8000}
      VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "5173:5173"

volumes:
  jazz-pgdata:
