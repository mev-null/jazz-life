services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jazz
      POSTGRES_PASSWORD: jazz
      POSTGRES_DB: jazz
    volumes:
      - jazz-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jazz -d jazz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: jazz-life-backend:dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://jazz:jazz@db:5432/jazz
      TEST_DATABASE_URL: postgresql+psycopg://jazz:jazz@db:5432/jazz_test
      # Codespaces / host shell からシークレットを forward する。.env に値があれば
      # env_file 経由でそれが採用され、host shell の値が空なら ${...:-} で空が入る。
      # 同時に両方ある場合は environment が env_file を上書きするので、Codespaces
      # secret を真実の出所にしたいときは .env から削除する。
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: jazz-life-frontend:dev
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  jazz-pgdata:
